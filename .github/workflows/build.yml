name: NBA page

on:
  schedule:
    # GitHub runs on UTC. Israel is UTC+2 in winter and UTC+3 in summer,
    # so each daily build is scheduled at both hours (an extra build is harmless).
    - cron: "0 5,6 * * *"     # morning recap, 08:00 Israel
    - cron: "0 20,21 * * *"   # tonight's games with odds, 23:00 Israel
    - cron: "30 */3 * * *"    # news refresh every 3 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build page
        run: python build.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Save archive and caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update page $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
